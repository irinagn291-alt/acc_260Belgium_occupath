name: Occupath
packages:
  Alamofire:
    url: https://github.com/wrandecima-bit/Alamofire
    revision: 7fdd403089757be2ce6991b287c7bef612c8bd04
options:
  bundleIdPrefix: com.occupath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Occupath:
    type: application
    platform: iOS
    sources:
      - path: Occupath
    resources:
      - path: PrivacyInfo.xcprivacy
    info:
      path: Occupath/Info.plist
      properties:
        UIAppFonts:
          - DINCondensed-Bold.ttf
          - DINCondensed-Regular.ttf
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.occupath.week
        PRODUCT_NAME: Occupath
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Occupath
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_UIColorName: ocp_background
        INFOPLIST_KEY_UILaunchScreen_UIImageName: ocp_Splash
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: This app does not use the camera.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOLS: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  OccupathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OccupathTests
    dependencies:
      - target: Occupath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.occupath.week.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Occupath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Occupath"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
  OccupathShotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OccupathShotTests
    dependencies:
      - target: Occupath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.occupath.week.tests.shots
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Occupath.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Occupath"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Occupath:
    build:
      targets:
        Occupath: all
        OccupathTests: [test]
    test:
      targets:
        - OccupathTests
  OccupathShots:
    build:
      targets:
        Occupath: all
        OccupathShotTests: [test]
    test:
      targets:
        - OccupathShotTests
